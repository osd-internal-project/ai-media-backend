name: Deploy Worker Service

on:
  push:
    branches: [main]
    paths:
      - "services/worker-service/**"
      - "libs/**"
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Deploy env'
        required: true
        type: choice
        default: sit
        options:
          - sit
          - uat
          - prod

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service_path: services/worker-service
      image_name: ai-cave-worker-service
      chart_dir: charts/aicave-worker-chart
      deploy_env: ${{ inputs.deploy_env || 'sit' }}
    secrets: inherit
