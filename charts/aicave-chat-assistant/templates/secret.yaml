{{- if .Values.secrets }}
# NOTE: This template creates a Kubernetes Secret from values.
# For production, manage secrets via external secret manager (e.g. Vault, AWS Secrets Manager)
# and comment out this file.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.openaiApiKey.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
type: Opaque
stringData:
  {{ .Values.secrets.openaiApiKey.secretKey }}: {{ .Values.env.openaiApiKey | default "" | quote }}
{{- end }}
