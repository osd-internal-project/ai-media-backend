# SIT Environment Values
# Override specific values for SIT environment

namespace: aicave-sit
replicaCount: 1

image:
  tag: "1.0.25"

ingress:
  hosts:
    - host: sit.aicave.ai
      paths:
        - path: /public/api/v1/core(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls-sit

env:
  nodeEnv: "Development"
  port: "4002"
  pathMountdirUpload: "./uploads"
  storagePath: "https://sit.aicave.ai/public/api/v1/s3"
  tosBucket: "ai-cave-sit"
  tosRegion: "ap-southeast-3"
  tosEndpoint: "tos-ap-southeast-3.bytepluses.com"
  redisHost: "my-redis-master.redis.svc.cluster.local"
  redisPort: "6379"
  emailApiUrl: "http://aicave-email-api-service.aicave-sit.svc.cluster.local:8974"
  receive: "taksapongk@osd.co.th"


# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL
#   secretEnv.BYTEPLUS_ACCESS_KEY
#   secretEnv.BYTEPLUS_SECRET_KEY
#   secretEnv.TOS_ACCESS_KEY
#   secretEnv.TOS_SECRET_KEY

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "256Mi"
    cpu: "500m"
