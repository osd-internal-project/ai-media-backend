# UAT Environment Values
# Override specific values for UAT environment
# Accessed via: aicave-email-api-service.aicave.svc.cluster.local:8974

namespace: aicave
replicaCount: 1

image:
  tag: "1.0.1"

env:
  nodeOptions: "--max-old-space-size=288"
  nodeEnv: "staging"
  port: "5000"
  redisHost: "my-redis-master"
  redisPort: "6379"
  # SMTP relay (Office 365 direct-send, unauthenticated). Reachable directly from the cluster.
  emailHost: "103.197.245.8"
  emailPort: "25"
  emailSecure: "false"
  emailFrom: '"AI Cave Support" <aicavesupport@osd.co.th>'

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "384Mi"
    cpu: "750m"

# No metrics-server on the UAT cluster: an HPA cannot read metrics and would force minReplicas.
autoscaling:
  enabled: false
