# UAT Environment Values
# Override specific values for UAT environment

namespace: aicave-uat
replicaCount: 2

image:
  tag: "1.0.25"

ingress:
  hosts:
    - host: uat.aicave.ai
      paths:
        - path: /public/api/v1/core(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls-uat

env:
  authMode: "report"
  keycloakAllowedClients: "ai-cave-prod"
  keycloakUrl: "https://id24-uat.aicave.ai"
  keycloakRealm: "eportal"
  nodeOptions: "--max-old-space-size=288"
  nodeEnv: "staging"
  port: "4002"
  pathMountdirUpload: "./uploads"
  storagePath: "https://uat.aicave.ai/public/api/v1/s3"
  tosBucket: "ai-cave"
  tosRegion: "ap-southeast-3"
  tosEndpoint: "tos-ap-southeast-3.bytepluses.com"
  redisHost: "my-redis-master"
  redisPort: "6379"
  emailApiUrl: "http://aicave-email-api-service.aicave-uat.svc.cluster.local:8974"
  receiveEmail: "taksapongk@osd.co.th"
  llmGatewayUrl: "https://llmgateway.osd.co.th/api"
  llmProjectId: "team-mrcx7er7"


otel:
  # OTLP HTTP endpoint (Tempo/Alloy) — ว่าง = ปิด telemetry
  endpoint: ""
  serviceName: "aicave-core"
  # Tempo ไม่รับ metrics — ใช้ "otlp" เมื่อมี Alloy/collector
  metricsExporter: "none"
  environment: "uat"
  samplerRatio: "0.5"
  disabled: false

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL
#   secretEnv.OTEL_EXPORTER_OTLP_HEADERS (optional, เช่น "Authorization=Basic xxx")
#   secretEnv.BYTEPLUS_ACCESS_KEY
#   secretEnv.BYTEPLUS_SECRET_KEY
#   secretEnv.TOS_ACCESS_KEY
#   secretEnv.TOS_SECRET_KEY

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "384Mi"
    cpu: "750m"
