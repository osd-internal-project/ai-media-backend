# UAT Environment Values
# Override specific values for UAT environment

namespace: aicave
replicaCount: 1

image:
  tag: "1.0.1"

env:
  nodeOptions: "--max-old-space-size=288"
  nodeEnv: "staging"
  port: "5001"
  redisHost: "my-redis-master"
  redisPort: "6379"
  smtpHost: "smtp.office365.com"
  smtpPort: "587"
  smtpUser: "internalsupport@osd.co.th"
  smtpFrom: "internalsupport@osd.co.th"
  smtpService: "outlook"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.SMTP_PASSWORD

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "384Mi"
    cpu: "750m"

# No metrics-server on the UAT cluster: an HPA cannot read metrics and would force minReplicas.
autoscaling:
  enabled: false
