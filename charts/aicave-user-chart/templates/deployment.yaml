apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      containers:
      - name: {{ .Values.appName }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.containerPort }}
          protocol: TCP
        env:
        - name: NODE_ENV
          value: {{ .Values.env.nodeEnv | quote }}
        - name: PORT
          value: {{ .Values.env.port | quote }}
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: {{ .Values.env.nodeTlsRejectUnauthorized | quote }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: DATABASE_URL
        - name: PATH_MOUNTDIR_UPLOAD
          value: {{ .Values.env.pathMountdirUpload | quote }}
        - name: PATH_DOMAIN
          value: {{ .Values.env.pathDomain | quote }}
        - name: EMAIL_API_URL
          value: {{ .Values.env.emailApiUrl | quote }}
        - name: FRONTEND_URL
          value: {{ .Values.env.frontendUrl | quote }}
        - name: KEYCLOAK_URL
          value: {{ .Values.env.keycloakUrl | quote }}
        - name: KEYCLOAK_REALM
          value: {{ .Values.env.keycloakRealm | quote }}
        - name: KEYCLOAK_CLIENT_ID
          value: {{ .Values.env.keycloakClientId | quote }}
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: KEYCLOAK_CLIENT_SECRET
        - name: KEYCLOAK_REDIRECT_URI
          value: {{ .Values.env.keycloakRedirectUri | quote }}
        - name: KEYCLOAK_IDP_MICROSOFT_ALIAS
          value: {{ .Values.env.keycloakIdpMicrosoftAlias | quote }}
        - name: LLM_GATEWAY_URL
          value: {{ .Values.env.llmGatewayUrl | quote }}
        - name: LLM_PROJECT_ID
          value: {{ .Values.env.llmProjectId | quote }}
        - name: LLM_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: LLM_ADMIN_TOKEN
        - name: OMISE_API_URL
          value: {{ .Values.env.omiseApiUrl | quote }}
        - name: OMISE_API_VERSION
          value: {{ .Values.env.omiseApiVersion | quote }}
        - name: OMISE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: OMISE_SECRET_KEY
        resources:
          requests:
            memory: {{ .Values.resources.requests.memory | quote }}
            cpu: {{ .Values.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.resources.limits.memory | quote }}
            cpu: {{ .Values.resources.limits.cpu | quote }}
