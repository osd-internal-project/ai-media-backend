# SIT Environment Values
namespace: aicave-sit
replicaCount: 1

image:
  tag: "v1.0.0"

ingress:
  hosts:
    - host: sit.aicave.ai
      paths:
        - path: /public/api/v1/chat-assistant(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls-sit

env:
  nodeEnv: "Development"
  port: "4004"
  databaseUrl: "postgresql://ai_cave_sit:osd@1234@10.134.2.3:5432/ai_cave_sit?schema=public"
  openaiApiKey: ""
  openaiBaseUrl: "https://api.openai.com/v1"
  openaiModel: "gpt-4.1-nano"
  openaiFullbackModel: "gpt-4.1-nano"
  openaiMaxRetries: "2"
  openaiTimeoutMs: "30000"
  moderationEnabled: "false"
  memoryMaxMessages: "10"
  memoryMaxTokenBudget: "4000"

secrets:
  openaiApiKey:
    secretName: chat-assistant-secrets
    secretKey: OPENAI_API_KEY

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"
