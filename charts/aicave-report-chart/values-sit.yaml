# SIT Environment Values
# Override specific values for SIT environment

namespace: aicave-sit
replicaCount: 1

image:
  tag: "1.0.0"

ingress:
  hosts:
    - host: sit.aicave.ai
      paths:
        - path: /public/api/v1/report(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls-sit

env:
  nodeOptions: "--max-old-space-size=192"
  nodeEnv: "Development"
  port: "4001"
  pathMountdirUpload: "./uploads"
  pathDomain: "http://sit.aicave.ai"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "256Mi"
    cpu: "500m"
