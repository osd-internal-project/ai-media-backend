# Production Environment Values
# Override specific values for PROD environment

namespace: aicave-prod
replicaCount: 3

image:
  tag: "1.0.4"

ingress:
  hosts:
    - host: www.aicave.ai
      paths:
        - path: /public/api/v1/user(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls

env:
  nodeEnv: "development"
  port: "4000"
  nodeTlsRejectUnauthorized: "0"
  databaseUrl: "postgresql://ai_cave:osd@1234@10.134.2.3:5432/ai_cave_uat?schema=public"
  pathMountdirUpload: "./uploads"
  pathDomain: "http://www.aicave.ai"
  emailApiUrl: "http://aicave-email-api-service.aicave-prod.svc.cluster.local:8974"
  frontendUrl: "https://www.aicave.ai"
  keycloakUrl: "https://id24.aicave.ai"
  keycloakRealm: "eportal"
  keycloakClientId: "eportal-client-id"
  keycloakClientSecret: "kovdYL3AAs9v6e3zxNw4o3CbaBwZiCId"
  keycloakRedirectUri: "https://www.aicave.ai/callback"

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"
