# Production Environment Values
# Override specific values for PROD environment

namespace: aicave-prod
replicaCount: 3

image:
  tag: "1.0.30"

ingress:
  hosts:
    - host: www.aicave.ai
      paths:
        - path: /public/api/v1/core(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls

env:
  authMode: "report"
  keycloakAllowedClients: "ai-cave-prod"
  keycloakUrl: "https://id24.aicave.ai"
  keycloakRealm: "eportal"
  nodeOptions: "--max-old-space-size=384"
  nodeEnv: "Production"
  port: "4002"
  pathMountdirUpload: "./uploads"
  storagePath: "https://www.aicave.ai/public/api/v1/s3"
  tosBucket: "ai-cave"
  tosRegion: "ap-southeast-3"
  tosEndpoint: "tos-ap-southeast-3.bytepluses.com"
  redisHost: "my-redis-master"
  redisPort: "6379"
  emailApiUrl: "http://aicave-email-api-service.aicave-prod.svc.cluster.local:8974"
  receiveEmail: "aicavesupport@osd.co.th"
  llmGatewayUrl: "https://llmgateway.osd.co.th/api"
  llmProjectId: "team-mqt1b3qx"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL
#   secretEnv.BYTEPLUS_ACCESS_KEY
#   secretEnv.BYTEPLUS_SECRET_KEY
#   secretEnv.TOS_ACCESS_KEY
#   secretEnv.TOS_SECRET_KEY

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"
