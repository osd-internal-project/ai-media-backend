name: Deploy Core Service

on:
  push:
    branches: [main]
    paths:
      - "services/core/**"
      - "libs/**"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service_path: services/core
      image_name: ai-core-be
      chart_dir: aicave-core-chart
    secrets: inherit
