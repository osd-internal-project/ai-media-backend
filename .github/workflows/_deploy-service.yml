name: Deploy Service (Reusable)

on:
  workflow_call:
    inputs:
      service_path:
        description: "Path to the service (e.g. services/core)"
        required: true
        type: string
      image_name:
        description: "Docker image name (e.g. ai-core-be)"
        required: true
        type: string
      chart_dir:
        description: "Helm chart directory name (e.g. aicave-core-chart)"
        required: true
        type: string

jobs:
  build-and-deploy:
    runs-on: [self-hosted, k8s]

    steps:
      # ---------------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Read version from the service's own package.json
      # ---------------------------------------------------------------------
      - name: Read Package Version
        id: pkg
        run: |
          VER=$(jq -r .version ${{ inputs.service_path }}/package.json)
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "Package: ${{ inputs.image_name }}"
          echo "Version: ${VER}"
          echo "Deploy Env: ${{ secrets.DEPLOY_ENV }}"

      # ---------------------------------------------------------------------
      # Build Docker image (build context is root for Turbo monorepo)
      # ---------------------------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build --no-cache --platform linux/amd64 \
            -t ${{ inputs.image_name }}:${{ steps.pkg.outputs.ver }} \
            -f ${{ inputs.service_path }}/Dockerfile .

      # ---------------------------------------------------------------------
      # Save Docker image as TAR
      # ---------------------------------------------------------------------
      - name: Save Docker Image as TAR
        run: |
          docker save -o image.tar \
            ${{ inputs.image_name }}:${{ steps.pkg.outputs.ver }}

      # ---------------------------------------------------------------------
      - name: Prune Docker Image and Build Cache
        run: |
          docker rmi ${{ inputs.image_name }}:${{ steps.pkg.outputs.ver }} || true
          docker image prune -f
          docker builder prune -f

      # ---------------------------------------------------------------------
      # Upload image TAR to all K8s workers
      # ---------------------------------------------------------------------
      - name: Upload TAR to Worker 1 (osd-saas01-worker-0001)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.WORKER_1_IP }}
          username: ${{ secrets.WORKER_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          source: "image.tar"
          target: "/tmp/"

      - name: Upload TAR to Worker 2 (osd-saas01-worker-0002)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.WORKER_2_IP }}
          username: ${{ secrets.WORKER_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          source: "image.tar"
          target: "/tmp/"

      - name: Upload TAR to Worker 3 (osd-saas01-worker-0003)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.WORKER_3_IP }}
          username: ${{ secrets.WORKER_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          source: "image.tar"
          target: "/tmp/"

      # ---------------------------------------------------------------------
      # Import image into containerd (k8s.io namespace) on all workers
      # ---------------------------------------------------------------------
      - name: Import Image on Worker 1
        uses: appleboy/ssh-action@master
        env:
          SUDO_PASS: ${{ secrets.PASSWORD }}
          IMAGE_REF: docker.io/library/${{ inputs.image_name }}:${{ steps.pkg.outputs.ver }}
        with:
          host: ${{ secrets.WORKER_1_IP }}
          username: ${{ secrets.WORKER_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          envs: SUDO_PASS,IMAGE_REF
          script: |
            set -e
            trap 'rm -f /tmp/image.tar' EXIT
            find /tmp -maxdepth 1 -name '*.tar.gz' -delete 2>/dev/null || true
            echo "$SUDO_PASS" | sudo -S ctr -n k8s.io images rm "${IMAGE_REF}" 2>/dev/null || true
            echo "Importing image on osd-saas01-worker-0001..."
            echo "$SUDO_PASS" | sudo -S ctr -n k8s.io images import /tmp/image.tar
            echo "$SUDO_PASS" | sudo -S ctr -n k8s.io images label "${IMAGE_REF}" io.cri-containerd.pinned=pinned
            echo "Done"

      - name: Import Image on Worker 2
        uses: appleboy/ssh-action@master
        env:
          SUDO_PASS: ${{ secrets.PASSWORD }}
          IMAGE_REF: docker.io/library/${{ inputs.image_name }}:${{ steps.pkg.outputs.ver }}
        with:
          host: ${{ secrets.WORKER_2_IP }}
          username: ${{ secrets.WORKER_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          envs: SUDO_PASS,IMAGE_REF
          script: |
            set -e
            trap 'rm -f /tmp/image.tar' EXIT
            find /tmp -maxdepth 1 -name '*.tar.gz' -delete 2>/dev/null || true
            echo "$SUDO_PASS" | sudo -S ctr -n k8s.io images rm "${IMAGE_REF}" 2>/dev/null || true
            echo "Importing image on osd-saas01-worker-0002..."
            echo "$SUDO_PASS" | sudo -S ctr -n k8s.io images import /tmp/image.tar
            echo "$SUDO_PASS" | sudo -S ctr -n k8s.io images label "${IMAGE_REF}" io.cri-containerd.pinned=pinned
            echo "Done"

      - name: Import Image on Worker 3
        uses: appleboy/ssh-action@master
        env:
          SUDO_PASS: ${{ secrets.PASSWORD }}
          IMAGE_REF: docker.io/library/${{ inputs.image_name }}:${{ steps.pkg.outputs.ver }}
        with:
          host: ${{ secrets.WORKER_3_IP }}
          username: ${{ secrets.WORKER_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          envs: SUDO_PASS,IMAGE_REF
          script: |
            set -e
            trap 'rm -f /tmp/image.tar' EXIT
            find /tmp -maxdepth 1 -name '*.tar.gz' -delete 2>/dev/null || true
            echo "$SUDO_PASS" | sudo -S ctr -n k8s.io images rm "${IMAGE_REF}" 2>/dev/null || true
            echo "Importing image on osd-saas01-worker-0003..."
            echo "$SUDO_PASS" | sudo -S ctr -n k8s.io images import /tmp/image.tar
            echo "$SUDO_PASS" | sudo -S ctr -n k8s.io images label "${IMAGE_REF}" io.cri-containerd.pinned=pinned
            echo "Done"

      # ---------------------------------------------------------------------
      # Cleanup runner workspace and orphaned SCP artifacts on Worker 1.
      # ---------------------------------------------------------------------
      - name: Cleanup Runner Workspace and Orphaned SCP Artifacts
        if: always()
        run: |
          rm -f image.tar
          find /tmp -maxdepth 1 -name '*.tar.gz' -delete 2>/dev/null || true

      # ---------------------------------------------------------------------
      # Helm upgrade (runs on self-hosted runner which has kubectl + helm)
      # ---------------------------------------------------------------------
      - name: Helm Upgrade
        run: |
          set -e
          DEPLOY_ENV="${{ secrets.DEPLOY_ENV }}"
          IMAGE="${{ inputs.image_name }}"
          VER="${{ steps.pkg.outputs.ver }}"
          CHART="${{ inputs.chart_dir }}"
          RELEASE=$(grep '^name:' ${CHART}/Chart.yaml | awk '{print $2}')

          echo "Helm upgrade ${RELEASE} (env: ${DEPLOY_ENV})"

          helm upgrade --install ${RELEASE} ./${CHART} \
            -f ./${CHART}/values-${DEPLOY_ENV}.yaml \
            --set image.repository=docker.io/library/${IMAGE} \
            --set image.tag=${VER} \
            --namespace aicave-${DEPLOY_ENV} \
            --wait \
            --timeout 5m \
            --atomic

          echo "Deployment completed: ${IMAGE}:${VER} (env: ${DEPLOY_ENV})"

      # ---------------------------------------------------------------------
      # Verify deployment
      # ---------------------------------------------------------------------
      - name: Verify Deployment
        run: |
          DEPLOY_ENV="${{ secrets.DEPLOY_ENV }}"
          CHART="${{ inputs.chart_dir }}"
          RELEASE=$(grep '^name:' ${CHART}/Chart.yaml | awk '{print $2}')
          kubectl rollout status deployment/${RELEASE} -n aicave-${DEPLOY_ENV}
          kubectl get pods -n aicave-${DEPLOY_ENV} -l app=${RELEASE}
