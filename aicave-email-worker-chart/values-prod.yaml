# Production Environment Values
# Override specific values for PROD environment

namespace: aicave-prod
replicaCount: 3

image:
  tag: "v1.0.3"

env:
  nodeEnv: "Production"
  port: "5001"
  redisHost: "my-redis-master"
  redisPort: "6379"
  smtpHost: "smtp.office365.com"
  smtpPort: "587"
  smtpUser: "internalsupport@osd.co.th"
  smtpPassword: "Internal-support@osd1234."
  smtpFrom: "internalsupport@osd.co.th"
  smtpService: "outlook"

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"
