# Production Environment Values
# Override specific values for PROD environment

namespace: aicave-prod
replicaCount: 3

image:
  tag: "1.0.0"

ingress:
  hosts:
    - host: www.aicave.ai
      paths:
        - path: /public/api/v1/chat-assistant(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls

env:
  nodeEnv: "Production"
  port: "4004"
  openaiBaseUrl: "https://api.openai.com/v1"
  openaiModel: "gpt-5-nano"
  openaiFullbackModel: "gpt-4.1-nano"
  openaiMaxRetries: "3"
  openaiTimeoutMs: "60000"
  moderationEnabled: "true"
  memoryMaxMessages: "20"
  memoryMaxTokenBudget: "8000"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL
#   secretEnv.OPENAI_API_KEY

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "768Mi"
    cpu: "1000m"
