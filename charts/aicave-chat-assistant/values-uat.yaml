# UAT Environment Values
namespace: aicave-uat
replicaCount: 2

image:
  tag: "1.0.0"

ingress:
  hosts:
    - host: uat.aicave.ai
      paths:
        - path: /public/api/v1/chat-assistant(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls-uat

env:
  nodeEnv: "staging"
  port: "4004"
  databaseUrl: "postgresql://ai_cave:osd@1234@10.134.2.3:5432/ai_cave?schema=public"
  openaiApiKey: ""
  openaiBaseUrl: "https://api.openai.com/v1"
  openaiModel: "gpt-5-nano"
  openaiFullbackModel: "gpt-4.1-nano"
  openaiMaxRetries: "3"
  openaiTimeoutMs: "60000"
  moderationEnabled: "true"
  memoryMaxMessages: "20"
  memoryMaxTokenBudget: "8000"

secrets:
  openaiApiKey:
    secretName: chat-assistant-secrets
    secretKey: OPENAI_API_KEY

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "750m"
