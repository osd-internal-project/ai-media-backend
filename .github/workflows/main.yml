name: CI Workflow

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Deploy env'
        required: true
        type: choice
        default: sit
        options:
          - sit
          - uat
          - prod

env:
  DEPLOY_ENV: ${{ inputs.deploy_env || 'sit' }}

jobs:
  build-and-deploy:
    runs-on: [self-hosted, k8s]

    steps:
      # ---------------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Read package info
      # ---------------------------------------------------------------------
      - name: Read Package Info
        id: pkg
        run: |
          echo "name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"
          echo "ver=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "📦 Package: $(jq -r .name package.json)"
          echo "📦 Version: $(jq -r .version package.json)"
          echo "🌍 Deploy Env: ${{ env.DEPLOY_ENV }}"

      # ---------------------------------------------------------------------
      # Build Docker image
      # ---------------------------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build --no-cache --platform linux/amd64 \
            -t ${{ steps.pkg.outputs.name }}:${{ steps.pkg.outputs.ver }} -f ./Dockerfile .

      # ---------------------------------------------------------------------
      # Save Docker image as TAR
      # ---------------------------------------------------------------------
      - name: Save Docker Image as TAR
        run: |
          docker save -o image.tar \
            ${{ steps.pkg.outputs.name }}:${{ steps.pkg.outputs.ver }}

      # ---------------------------------------------------------------------
      # Upload image TAR to all K8s workers
      # ---------------------------------------------------------------------
      - name: Upload TAR to Worker 1 (osd-saas01-worker-0001)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.WORKER_1_IP }}
          username: ${{ secrets.WORKER_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          source: "image.tar"
          target: "/tmp/"

      - name: Upload TAR to Worker 2 (osd-saas01-worker-0002)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.WORKER_2_IP }}
          username: ${{ secrets.WORKER_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          source: "image.tar"
          target: "/tmp/"

      - name: Upload TAR to Worker 3 (osd-saas01-worker-0003)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.WORKER_3_IP }}
          username: ${{ secrets.WORKER_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          source: "image.tar"
          target: "/tmp/"

      # ---------------------------------------------------------------------
      # Import image into containerd (k8s.io namespace) on all workers
      # ---------------------------------------------------------------------
      - name: Import Image on Worker 1
        uses: appleboy/ssh-action@master
        env:
          SUDO_PASS: ${{ secrets.PASSWORD }}
        with:
          host: ${{ secrets.WORKER_1_IP }}
          username: ${{ secrets.WORKER_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          envs: SUDO_PASS
          script: |
            set -e
            echo "📦 Importing image on osd-saas01-worker-0001..."
            echo "$SUDO_PASS" | sudo -S ctr -n k8s.io images import /tmp/image.tar
            rm -f /tmp/image.tar
            echo "✅ Done"

      - name: Import Image on Worker 2
        uses: appleboy/ssh-action@master
        env:
          SUDO_PASS: ${{ secrets.PASSWORD }}
        with:
          host: ${{ secrets.WORKER_2_IP }}
          username: ${{ secrets.WORKER_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          envs: SUDO_PASS
          script: |
            set -e
            echo "📦 Importing image on osd-saas01-worker-0002..."
            echo "$SUDO_PASS" | sudo -S ctr -n k8s.io images import /tmp/image.tar
            rm -f /tmp/image.tar
            echo "✅ Done"

      - name: Import Image on Worker 3
        uses: appleboy/ssh-action@master
        env:
          SUDO_PASS: ${{ secrets.PASSWORD }}
        with:
          host: ${{ secrets.WORKER_3_IP }}
          username: ${{ secrets.WORKER_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          envs: SUDO_PASS
          script: |
            set -e
            echo "📦 Importing image on osd-saas01-worker-0003..."
            echo "$SUDO_PASS" | sudo -S ctr -n k8s.io images import /tmp/image.tar
            rm -f /tmp/image.tar
            echo "✅ Done"

      # ---------------------------------------------------------------------
      # Helm upgrade (runs directly on self-hosted runner)
      # ---------------------------------------------------------------------
      # - name: Helm Upgrade
      #   run: |
      #     set -e

      #     DEPLOY_ENV="${{ env.DEPLOY_ENV }}"
      #     NAME="${{ steps.pkg.outputs.name }}"
      #     VER="${{ steps.pkg.outputs.ver }}"

      #     echo "🚀 Helm upgrade aicave-console (env: prod)"

      #     helm upgrade --install aicave-console ./aicave-console-chart \
      #       -f ./aicave-console-chart/values-${DEPLOY_ENV}.yaml \
      #       --set image.repository=docker.io/library/${NAME} \
      #       --set image.tag=${VER} \
      #       --namespace aicave-${DEPLOY_ENV} \
      #       --wait \
      #       --timeout 5m \
      #       --atomic

      #     echo "✅ Deployment completed: ${NAME}:${VER} (env: prod)"

