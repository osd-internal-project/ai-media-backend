# Default values for aicave-email-worker-service
# This is a YAML-formatted file.
# Internal service only - no ingress.

appName: aicave-email-worker-service
namespace: aicave-prod
replicaCount: 3

image:
  repository: docker.io/library/ai-cave-email-worker
  pullPolicy: Always
  tag: "1.0.3"

imagePullSecretName: huawei-swr-secret

service:
  type: ClusterIP
  port: 8975
  targetPort: 5001
  containerPort: 5001

env:
  nodeEnv: "Production"
  port: "5001"
  redisHost: "my-redis-master"
  redisPort: "6379"
  smtpHost: "smtp.office365.com"
  smtpPort: "587"
  smtpUser: "internalsupport@osd.co.th"
  smtpPassword: "Internal-support@osd1234."
  smtpFrom: "internalsupport@osd.co.th"
  smtpService: "outlook"

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nameOverride: ""
fullnameOverride: ""
