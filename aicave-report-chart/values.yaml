# Default values for aicave-report-service
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

appName: aicave-report-service
namespace: aicave-prod
replicaCount: 3

image:
  repository: docker.io/library/ai-report-be
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

service:
  type: ClusterIP
  port: 8973
  targetPort: 4001
  containerPort: 8973

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /api/$2
  hosts:
    - host: www.aicave.ai
      paths:
        - path: /public/api/v1/report(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls

env:
  nodeEnv: "Production"
  port: "4001"
  databaseUrl: "postgresql://ai_cave:osd@1234@10.134.2.3:5432/ai_cave?schema=public"
  pathMountdirUpload: "./uploads"
  pathDomain: "http://www.aicave.ai"

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

nameOverride: ""
fullnameOverride: ""
