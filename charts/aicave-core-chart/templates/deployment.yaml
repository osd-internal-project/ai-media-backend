apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      containers:
      - name: {{ .Values.appName }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.containerPort }}
          protocol: TCP
        env:
        - name: NODE_ENV
          value: {{ .Values.env.nodeEnv | quote }}
        {{- if .Values.env.nodeOptions }}
        - name: NODE_OPTIONS
          value: {{ .Values.env.nodeOptions | quote }}
        {{- end }}
        - name: PORT
          value: {{ .Values.env.port | quote }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: DATABASE_URL
        - name: PATH_MOUNTDIR_UPLOAD
          value: {{ .Values.env.pathMountdirUpload | quote }}
        - name: STORAGE_PATH
          value: {{ .Values.env.storagePath | quote }}
        - name: BYTEPLUS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: BYTEPLUS_ACCESS_KEY
        - name: BYTEPLUS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: BYTEPLUS_SECRET_KEY
        - name: TOS_BUCKET
          value: {{ .Values.env.tosBucket | quote }}
        - name: TOS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: TOS_ACCESS_KEY
        - name: TOS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: TOS_SECRET_KEY
        - name: TOS_REGION
          value: {{ .Values.env.tosRegion | quote }}
        - name: TOS_ENDPOINT
          value: {{ .Values.env.tosEndpoint | quote }}
        - name: BYTEPLUS_CALLBACK_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: BYTEPLUS_CALLBACK_SECRET
              # ไม่มี key นี้ = ไม่ส่ง callback_url (ใช้ poll-check อย่างเดียว) ไม่ทำให้ pod start ไม่ขึ้น
              optional: true
        - name: REDIS_HOST
          value: {{ .Values.env.redisHost | quote }}
        - name: REDIS_PORT
          value: {{ .Values.env.redisPort | quote }}
        - name: EMAIL_API_URL
          value: {{ .Values.env.emailApiUrl | quote }}
        - name: RECEIVE_EMAIL
          value: {{ .Values.env.receiveEmail | quote }}
        - name: LLM_GATEWAY_URL
          value: {{ .Values.env.llmGatewayUrl | quote }}
        - name: LLM_PROJECT_ID
          value: {{ .Values.env.llmProjectId | quote }}
        - name: LLM_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: LLM_ADMIN_TOKEN
        resources:
          requests:
            memory: {{ .Values.resources.requests.memory | quote }}
            cpu: {{ .Values.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.resources.limits.memory | quote }}
            cpu: {{ .Values.resources.limits.cpu | quote }}
