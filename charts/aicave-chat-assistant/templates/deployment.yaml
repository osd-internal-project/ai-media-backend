apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      containers:
      - name: {{ .Values.appName }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.containerPort }}
          protocol: TCP
        env:
        - name: NODE_ENV
          value: {{ .Values.env.nodeEnv | quote }}
        {{- if .Values.env.nodeOptions }}
        - name: NODE_OPTIONS
          value: {{ .Values.env.nodeOptions | quote }}
        {{- end }}
        - name: PORT
          value: {{ .Values.env.port | quote }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: DATABASE_URL
        # LLM gateway. The per-request credential is the organization's own key,
        # minted on demand via LLM_ADMIN_TOKEN — there is no shared model API key
        # in this service any more.
        - name: LLM_GATEWAY_URL
          value: {{ .Values.env.llmGatewayUrl | quote }}
        - name: LLM_PROJECT_ID
          value: {{ .Values.env.llmProjectId | quote }}
        - name: LLM_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: LLM_ADMIN_TOKEN
        - name: LLM_CHAT_TIMEOUT_MS
          value: {{ .Values.env.llmChatTimeoutMs | quote }}
        # Memory window
        - name: MEMORY_MAX_MESSAGES
          value: {{ .Values.env.memoryMaxMessages | quote }}
        - name: MEMORY_MAX_TOKEN_BUDGET
          value: {{ .Values.env.memoryMaxTokenBudget | quote }}
        - name: CORS_ALLOWED_ORIGINS
          value: {{ .Values.env.corsAllowedOrigins | quote }}
        resources:
          requests:
            memory: {{ .Values.resources.requests.memory | quote }}
            cpu: {{ .Values.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.resources.limits.memory | quote }}
            cpu: {{ .Values.resources.limits.cpu | quote }}
