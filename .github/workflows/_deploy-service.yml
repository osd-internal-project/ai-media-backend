name: Deploy Service (Reusable)

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker image name (e.g. ai-core-be)"
        required: true
        type: string
      image_ver:
        description: "Docker image version/tag to deploy"
        required: true
        type: string
      chart_dir:
        description: "Helm chart directory path (e.g. charts/aicave-core-chart)"
        required: true
        type: string
      namespace:
        description: "Kubernetes namespace"
        required: true
        type: string
      deploy_env:
        description: "Environment to deploy (sit, uat, prod)"
        required: true
        type: string
        default: sit

env:
  DEPLOY_ENV: ${{ inputs.deploy_env }}

concurrency:
  group: deploy-${{ inputs.namespace }}-${{ inputs.image_name }}-${{ inputs.deploy_env }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, k8s]
    environment: ${{ inputs.deploy_env }}

    steps:
      # ---------------------------------------------------------------------
      # Checkout (needed for helm charts)
      # ---------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Create/refresh image pull secret in the target namespace (idempotent)
      # ---------------------------------------------------------------------
      - name: Create Image Pull Secret
        run: |
          kubectl create secret docker-registry huawei-swr-secret \
            --docker-server=swr.ap-southeast-2.myhuaweicloud.com \
            --docker-username=ap-southeast-2@HPUAGIPPWFA7YCNYJIGE \
            --docker-password=${{ secrets.HUAWEI_REGISTRY_PASSWORD }} \
            --namespace=${{ inputs.namespace }}-${{ env.DEPLOY_ENV }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # ---------------------------------------------------------------------
      # Fix stuck Helm release (pending-install / pending-upgrade)
      # ---------------------------------------------------------------------
      - name: Fix Stuck Helm Release
        run: |
          set -e
          DEPLOY_ENV="${{ env.DEPLOY_ENV }}"
          CHART="${{ inputs.chart_dir }}"
          RELEASE=$(grep '^name:' ${CHART}/Chart.yaml | awk '{print $2}')
          NS="${{ inputs.namespace }}-${DEPLOY_ENV}"

          STATUS=$(helm status ${RELEASE} -n ${NS} -o json 2>/dev/null | jq -r '.info.status' 2>/dev/null || echo "not-found")
          echo "Current Helm status for ${RELEASE}: ${STATUS}"

          if [[ "${STATUS}" == "pending-install" || "${STATUS}" == "pending-upgrade" || "${STATUS}" == "pending-rollback" ]]; then
            echo "Release is stuck in ${STATUS}, rolling back..."
            helm rollback ${RELEASE} 0 -n ${NS} --wait --timeout 2m || \
              helm uninstall ${RELEASE} -n ${NS} --no-hooks || true
            echo "Stuck release resolved"
          fi

      # ---------------------------------------------------------------------
      # Set Chart appVersion from image_ver
      # ---------------------------------------------------------------------
      - name: Set Chart appVersion
        run: |
          VER="${{ inputs.image_ver }}"
          CHART="${{ inputs.chart_dir }}"
          sed -i "s/^appVersion:.*/appVersion: \"${VER}\"/" ${CHART}/Chart.yaml
          echo "Set appVersion to ${VER} in ${CHART}/Chart.yaml"

      # ---------------------------------------------------------------------
      # Helm upgrade (runs on self-hosted runner which has kubectl + helm)
      # ---------------------------------------------------------------------
      - name: Helm Upgrade
        run: |
          set -e
          DEPLOY_ENV="${{ env.DEPLOY_ENV }}"
          IMAGE="${{ inputs.image_name }}"
          VER="${{ inputs.image_ver }}"
          CHART="${{ inputs.chart_dir }}"
          RELEASE=$(grep '^name:' ${CHART}/Chart.yaml | awk '{print $2}')

          echo "Helm upgrade ${RELEASE} (env: ${DEPLOY_ENV})"

          helm upgrade --install ${RELEASE} ./${CHART} \
            -f ./${CHART}/values-${DEPLOY_ENV}.yaml \
            --set image.repository=swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${IMAGE} \
            --set image.tag=${VER} \
            --set secretEnv.DATABASE_URL=${{ secrets.DATABASE_URL }} \
            --set secretEnv.BYTEPLUS_ACCESS_KEY=${{ secrets.BYTEPLUS_ACCESS_KEY }} \
            --set secretEnv.BYTEPLUS_SECRET_KEY=${{ secrets.BYTEPLUS_SECRET_KEY }} \
            --set secretEnv.TOS_ACCESS_KEY=${{ secrets.TOS_ACCESS_KEY }} \
            --set secretEnv.TOS_SECRET_KEY=${{ secrets.TOS_SECRET_KEY }} \
            --set secretEnv.SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }} \
            --set secretEnv.KEYCLOAK_CLIENT_SECRET=${{ secrets.KEYCLOAK_CLIENT_SECRET }} \
            --set secretEnv.OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            --set secretEnv.OMISE_SECRET_KEY=${{ secrets.OMISE_SECRET_KEY }} \
            --set secretEnv.LLM_ADMIN_TOKEN=${{ secrets.LLM_ADMIN_TOKEN }} \
            --set secretEnv.INTERNAL_API_KEY=${{ secrets.INTERNAL_API_KEY }} \
            --namespace ${{ inputs.namespace }}-${DEPLOY_ENV} \
            --wait \
            --timeout 5m \
            --atomic \
            --history-max 10

          echo "Deployment completed: ${IMAGE}:${VER} (env: ${DEPLOY_ENV})"

      # ---------------------------------------------------------------------
      # Verify deployment
      # ---------------------------------------------------------------------
      - name: Verify Deployment
        run: |
          DEPLOY_ENV="${{ env.DEPLOY_ENV }}"
          CHART="${{ inputs.chart_dir }}"
          RELEASE=$(grep '^name:' ${CHART}/Chart.yaml | awk '{print $2}')
          kubectl rollout status deployment/${RELEASE} -n ${{ inputs.namespace }}-${DEPLOY_ENV}
          kubectl get pods -n ${{ inputs.namespace }}-${DEPLOY_ENV} -l app=${RELEASE}

      # ---------------------------------------------------------------------
      # Tag deployment for rollback reference
      # ---------------------------------------------------------------------
      - name: Tag Deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          IMAGE="${{ inputs.image_name }}"
          VER="${{ inputs.image_ver }}"
          DEPLOY_ENV="${{ env.DEPLOY_ENV }}"
          TAG="${IMAGE}/${DEPLOY_ENV}/${VER}"

          echo "Tagging deployment: ${TAG}"
          git tag -f "${TAG}" -m "Deployed ${IMAGE}:${VER} to ${DEPLOY_ENV}"
          git push origin "${TAG}" --force

      # ---------------------------------------------------------------------
      # Debug on failure — capture pod state before rollback cleans up
      # ---------------------------------------------------------------------
      - name: Debug on Failure
        if: failure()
        run: |
          DEPLOY_ENV="${{ env.DEPLOY_ENV }}"
          NS="${{ inputs.namespace }}-${DEPLOY_ENV}"
          CHART="${{ inputs.chart_dir }}"
          RELEASE=$(grep '^name:' ${CHART}/Chart.yaml | awk '{print $2}')

          echo "====== POD STATUS ======"
          kubectl get pods -n ${NS} -l app=${RELEASE} -o wide

          echo "====== POD EVENTS ======"
          kubectl get events -n ${NS} --sort-by='.lastTimestamp' \
            --field-selector involvedObject.kind=Pod | tail -40

          echo "====== POD DESCRIBE ======"
          kubectl describe pods -n ${NS} -l app=${RELEASE} | tail -80

          echo "====== POD LOGS ======"
          for pod in $(kubectl get pods -n ${NS} -l app=${RELEASE} \
            --no-headers -o custom-columns=':metadata.name'); do
            echo "--- Logs: ${pod} ---"
            kubectl logs -n ${NS} ${pod} --tail=50 2>/dev/null || echo "(no logs)"
          done
