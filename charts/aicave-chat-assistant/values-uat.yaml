# UAT Environment Values
namespace: aicave
replicaCount: 1

image:
  tag: "1.0.0"

ingress:
  hosts:
    - host: aicave-uat.osd.co.th
      paths:
        - path: /public/api/v1/chat-assistant
          pathType: Prefix
  tls:
    enabled: true
    secretName: aicave-tls

env:
  authMode: "report"
  keycloakAllowedClients: "ai-cave-prod"
  keycloakUrl: "https://auth-events-uat.osd.co.th"
  keycloakRealm: "eportal"
  nodeOptions: "--max-old-space-size=384"
  nodeEnv: "staging"
  port: "4004"
  # LLM gateway — the per-request credential is each organization's own
  # minted key, so there is no shared model API key here any more.
  llmGatewayUrl: "https://llmgateway.osd.co.th"
  llmProjectId: "team-mrcx7er7"
  llmChatTimeoutMs: "60000"
  corsAllowedOrigins: "https://aicave-uat.osd.co.th"
  memoryMaxMessages: "20"
  memoryMaxTokenBudget: "8000"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL
#   secretEnv.LLM_ADMIN_TOKEN

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "750m"

# Resolve the UAT Keycloak host through the in-cluster Traefik (ClusterIP) so pods do
# not depend on public DNS / WAF for this name.
hostAliases:
  - ip: "100.96.0.228"
    hostnames:
      - "auth-events-uat.osd.co.th"
