# Default values for aicave-user-service
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

appName: aicave-user-service
namespace: aicave-prod
replicaCount: 3

image:
  repository: docker.io/library/ai-users-be
  pullPolicy: Always
  tag: "1.0.4"

imagePullSecretName: huawei-swr-secret

service:
  type: ClusterIP
  port: 8972
  targetPort: 4000
  containerPort: 4000

ingress:
  enabled: true
  className: traefik
  # Traefik has no per-ingress body limit by default. Set a byte count to enforce one (nginx proxy-body-size equivalent).
  # maxRequestBodyBytes: 0
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: www.aicave.ai
      paths:
        - path: /public/api/v1/user
          pathType: Prefix
  tls:
    enabled: true
    secretName: aicave-console-tls

env:
  authMode: "report"
  keycloakAllowedClients: "ai-cave-prod"
  nodeOptions: "--max-old-space-size=384"
  nodeEnv: "development"
  port: "4000"
  nodeTlsRejectUnauthorized: "0"
  # ไม่ใช้ Omise แล้ว (org สร้างโดย admin) — "true" เพื่อเปิดซื้อ/จ่ายเงินกลับมา
  billingEnabled: "false"
  pathMountdirUpload: "./uploads"
  pathDomain: "http://www.aicave.ai"
  emailApiUrl: "http://aicave-email-api-service.aicave-prod.svc.cluster.local:8974"
  coreApiUrl: "http://aicave-core-service.aicave-prod.svc.cluster.local:8971/api"
  frontendUrl: "https://www.aicave.ai"
  keycloakUrl: "https://id24.aicave.ai"
  keycloakRealm: "eportal"
  keycloakClientId: "ai-cave-prod"
  keycloakRedirectUri: "https://www.aicave.ai/callback"
  keycloakIdpMicrosoftAlias: "microsoft"
  llmGatewayUrl: "https://llmgateway.osd.co.th"
  llmProjectId: "team-mrcx7er7"
  omiseApiUrl: "https://api.omise.co"
  omiseApiVersion: "2019-05-29"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL
#   secretEnv.KEYCLOAK_CLIENT_SECRET
#   secretEnv.OMISE_SECRET_KEY

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nameOverride: ""
fullnameOverride: ""
