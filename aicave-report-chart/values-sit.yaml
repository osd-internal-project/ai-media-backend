# SIT Environment Values
# Override specific values for SIT environment

namespace: aicave-sit
replicaCount: 1

image:
  tag: "v1.0.0"

ingress:
  hosts:
    - host: sit.aicave.ai
      paths:
        - path: /public/api/v1/report(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls-sit

env:
  nodeEnv: "Development"
  port: "4001"
  databaseUrl: "postgresql://ai_cave:osd@1234@10.134.2.3:5432/ai_cave?schema=public"
  pathMountdirUpload: "./uploads"
  pathDomain: "http://sit.aicave.ai"

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "256Mi"
    cpu: "500m"
