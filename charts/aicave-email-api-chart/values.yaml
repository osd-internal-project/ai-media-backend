# Default values for aicave-email-api-service
# This is a YAML-formatted file.
# Internal service only - no ingress.
# Accessed via: aicave-email-api-service.<namespace>.svc.cluster.local:8974

appName: aicave-email-api-service
namespace: aicave-prod
replicaCount: 3

image:
  repository: docker.io/library/ai-cave-email-api
  pullPolicy: Always
  tag: "1.0.1"

imagePullSecretName: huawei-swr-secret

service:
  type: ClusterIP
  port: 8974
  targetPort: 5000
  containerPort: 5000

env:
  nodeEnv: "Production"
  port: "5000"
  redisHost: "my-redis-master"
  redisPort: "6379"
  # SMTP relay (Office 365 direct-send, unauthenticated). Reachable directly from the cluster.
  emailHost: "103.197.245.8"
  emailPort: "25"
  emailSecure: "false"
  emailFrom: '"AI Cave Support" <aicavesupport@osd.co.th>'

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nameOverride: ""
fullnameOverride: ""
