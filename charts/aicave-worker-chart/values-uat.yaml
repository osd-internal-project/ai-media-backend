# UAT Environment Values
# Override specific values for UAT environment

namespace: aicave-uat
replicaCount: 2

image:
  tag: "1.0.1"

ingress:
  hosts:
    - host: uat.aicave.ai
      paths:
        - path: /public/api/v1/worker(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls-uat
  websocketBackendService: aicave-core-service
  websocketBackendPort: 8971

env:
  authMode: "report"
  keycloakAllowedClients: "ai-cave-prod"
  keycloakUrl: "https://id24-uat.aicave.ai"
  keycloakRealm: "eportal"
  nodeOptions: "--max-old-space-size=288"
  nodeEnv: "staging"
  port: "4000"
  redisHost: "my-redis-master.aicave-uat.svc.cluster.local"
  redisPort: "6379"
  storagePath: "https://uat.aicave.ai/public/api/v1/s3"
  tosBucket: "ai-cave"
  tosRegion: "ap-southeast-3"
  tosEndpoint: "tos-ap-southeast-3.bytepluses.com"
  # TOS เรียก upload callback ที่ <workerPublicUrl>/upload/callback (ingress rewrite → /api)
  workerPublicUrl: "https://uat.aicave.ai/public/api/v1/worker"
  # Ark เรียก <byteplusCallbackBaseUrl>/webhooks/byteplus/video/:taskId ที่ core (ingress rewrite → /api)
  byteplusCallbackBaseUrl: "https://uat.aicave.ai/public/api/v1/core"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL
#   secretEnv.TOS_ACCESS_KEY
#   secretEnv.TOS_SECRET_KEY

otel:
  # OTLP HTTP endpoint (Tempo/Alloy) — ว่าง = ปิด telemetry
  endpoint: ""
  serviceName: "aicave-worker"
  # Tempo ไม่รับ metrics — ใช้ "otlp" เมื่อมี Alloy/collector
  metricsExporter: "none"
  environment: "uat"
  samplerRatio: "0.5"
  disabled: false

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "384Mi"
    cpu: "750m"
