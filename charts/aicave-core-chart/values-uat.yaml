# UAT Environment Values
# Override specific values for UAT environment

namespace: aicave
replicaCount: 1

image:
  tag: "1.0.25"

ingress:
  hosts:
    - host: aicave-uat.osd.co.th
      paths:
        - path: /public/api/v1/core
          pathType: Prefix
  tls:
    enabled: true
    secretName: aicave-tls

env:
  authMode: "report"
  keycloakAllowedClients: "aicave-uat"
  keycloakUrl: "https://auth-events-uat.osd.co.th"
  keycloakRealm: "eportal"
  nodeOptions: "--max-old-space-size=288"
  nodeEnv: "staging"
  port: "4002"
  pathMountdirUpload: "./uploads"
  storagePath: "https://aicave-uat.osd.co.th/public/api/v1/s3"
  tosBucket: "ai-cave"
  tosRegion: "ap-southeast-3"
  tosEndpoint: "tos-ap-southeast-3.bytepluses.com"
  redisHost: "my-redis-master"
  redisPort: "6379"
  emailApiUrl: "http://aicave-email-api-service.aicave.svc.cluster.local:8974"
  receiveEmail: "taksapongk@osd.co.th"
  llmGatewayUrl: "https://llmgateway.osd.co.th/api"
  llmProjectId: "team-mrcx7er7"


# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL
#   secretEnv.BYTEPLUS_ACCESS_KEY
#   secretEnv.BYTEPLUS_SECRET_KEY
#   secretEnv.TOS_ACCESS_KEY
#   secretEnv.TOS_SECRET_KEY

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "384Mi"
    cpu: "750m"

# Resolve the UAT Keycloak host through the in-cluster Traefik (ClusterIP) so pods do
# not depend on public DNS / WAF for this name.
hostAliases:
  - ip: "100.96.0.228"
    hostnames:
      - "auth-events-uat.osd.co.th"

# No metrics-server on the UAT cluster: an HPA cannot read metrics and would force minReplicas.
autoscaling:
  enabled: false
