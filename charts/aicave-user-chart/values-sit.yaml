# SIT Environment Values
# Override specific values for SIT environment

namespace: aicave-sit
replicaCount: 1

image:
  tag: "1.0.4"

ingress:
  hosts:
    - host: sit.aicave.ai
      paths:
        - path: /public/api/v1/user(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls-sit

env:
  authMode: "report"
  keycloakAllowedClients: "ai-cave-sit"
  nodeOptions: "--max-old-space-size=192"
  nodeEnv: "development"
  port: "4000"
  nodeTlsRejectUnauthorized: "0"
  pathMountdirUpload: "./uploads"
  pathDomain: "http://sit.aicave.ai"
  emailApiUrl: "http://aicave-email-api-service.aicave-sit.svc.cluster.local:8974"
  coreApiUrl: "http://aicave-core-service.aicave-sit.svc.cluster.local:8971/api"
  frontendUrl: "https://sit.aicave.ai"
  keycloakUrl: "https://id24.aicave.ai"
  keycloakRealm: "eportal"
  keycloakClientId: "ai-cave-sit"
  keycloakRedirectUri: "https://sit.aicave.ai/callback"
  keycloakIdpMicrosoftAlias: "microsoft"
  llmGatewayUrl: "https://llmgateway.osd.co.th"
  llmProjectId: "team-mr8w25rb"
  omiseApiUrl: "https://api.omise.co"
  omiseApiVersion: "2019-05-29"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL
#   secretEnv.KEYCLOAK_CLIENT_SECRET
#   secretEnv.OMISE_SECRET_KEY

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "256Mi"
    cpu: "500m"
