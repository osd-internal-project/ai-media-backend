# Production Environment Values
# Override specific values for PROD environment

namespace: aicave-prod
replicaCount: 3

image:
  tag: "1.0.3"

env:
  nodeEnv: "Production"
  port: "5001"
  redisHost: "my-redis-master"
  redisPort: "6379"
  smtpHost: "smtp.office365.com"
  smtpPort: "587"
  smtpUser: "internalsupport@osd.co.th"
  smtpFrom: "internalsupport@osd.co.th"
  smtpService: "outlook"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.SMTP_PASSWORD

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"
