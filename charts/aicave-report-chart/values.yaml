# Default values for aicave-report-service
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

appName: aicave-report-service
namespace: aicave-prod
replicaCount: 3

image:
  repository: docker.io/library/ai-report-be
  pullPolicy: Always
  tag: "1.0.0"

imagePullSecretName: huawei-swr-secret

service:
  type: ClusterIP
  port: 8973
  targetPort: 4001
  containerPort: 4001

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /api/$2
  hosts:
    - host: www.aicave.ai
      paths:
        - path: /public/api/v1/report(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls

env:
  nodeOptions: "--max-old-space-size=384"
  nodeEnv: "Production"
  port: "4001"
  pathMountdirUpload: "./uploads"
  pathDomain: "http://www.aicave.ai"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nameOverride: ""
fullnameOverride: ""
