# UAT Environment Values
# Override specific values for UAT environment

namespace: aicave
replicaCount: 1

image:
  tag: "1.0.1"

ingress:
  hosts:
    - host: aicave-uat.osd.co.th
      paths:
        - path: /public/api/v1/worker
          pathType: Prefix
  tls:
    enabled: true
    secretName: aicave-tls
  websocketBackendService: aicave-core-service
  websocketBackendPort: 8971

env:
  authMode: "report"
  keycloakAllowedClients: "aicave-uat"
  keycloakUrl: "https://auth-events-uat.osd.co.th"
  keycloakRealm: "eportal"
  nodeOptions: "--max-old-space-size=288"
  nodeEnv: "staging"
  port: "4000"
  redisHost: "my-redis-master.aicave.svc.cluster.local"
  redisPort: "6379"
  storagePath: "https://aicave-uat.osd.co.th/public/api/v1/s3"
  tosBucket: "ai-cave"
  tosRegion: "ap-southeast-3"
  tosEndpoint: "tos-ap-southeast-3.bytepluses.com"
  # TOS เรียก upload callback ที่ <workerPublicUrl>/upload/callback (ingress rewrite → /api)
  workerPublicUrl: "https://aicave-uat.osd.co.th/public/api/v1/worker"
  # Ark เรียก <byteplusCallbackBaseUrl>/webhooks/byteplus/video/:taskId ที่ core (ingress rewrite → /api)
  byteplusCallbackBaseUrl: "https://aicave-uat.osd.co.th/public/api/v1/core"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL
#   secretEnv.TOS_ACCESS_KEY
#   secretEnv.TOS_SECRET_KEY

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "384Mi"
    cpu: "750m"

# Resolve the UAT Keycloak host through the in-cluster Traefik (ClusterIP) so pods do
# not depend on public DNS / WAF for this name.
hostAliases:
  - ip: "100.96.0.228"
    hostnames:
      - "auth-events-uat.osd.co.th"
