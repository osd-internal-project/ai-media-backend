# Default values for aicave-core-service
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

appName: aicave-core-service
namespace: aicave-prod
replicaCount: 3

image:
  repository: docker.io/library/ai-core-be
  pullPolicy: Always
  tag: "1.0.30"

imagePullSecretName: huawei-swr-secret

service:
  type: ClusterIP
  port: 8971
  targetPort: 4002
  containerPort: 4002

ingress:
  enabled: true
  className: traefik
  # Traefik has no per-ingress body limit by default. Set a byte count to enforce one (nginx proxy-body-size equivalent).
  # maxRequestBodyBytes: 0
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: www.aicave.ai
      paths:
        - path: /public/api/v1/core
          pathType: Prefix
  tls:
    enabled: true
    secretName: aicave-console-tls

env:
  authMode: "report"
  keycloakAllowedClients: "ai-cave-prod"
  keycloakUrl: "https://id24.aicave.ai"
  keycloakRealm: "eportal"
  nodeOptions: "--max-old-space-size=384"
  nodeEnv: "Production"
  port: "4002"
  pathMountdirUpload: "./uploads"
  storagePath: "https://www.aicave.ai/public/api/v1/s3"
  tosBucket: "ai-cave"
  tosRegion: "ap-southeast-3"
  tosEndpoint: "tos-ap-southeast-3.bytepluses.com"
  redisHost: "my-redis-master"
  redisPort: "6379"
  llmGatewayUrl: "https://llmgateway.osd.co.th"
  llmProjectId: "team-mrcx7er7"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL
#   secretEnv.BYTEPLUS_ACCESS_KEY
#   secretEnv.BYTEPLUS_SECRET_KEY
#   secretEnv.TOS_ACCESS_KEY
#   secretEnv.TOS_SECRET_KEY
#   secretEnv.LLM_ADMIN_TOKEN

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nameOverride: ""
fullnameOverride: ""
