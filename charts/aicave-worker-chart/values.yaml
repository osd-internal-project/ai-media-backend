# Default values for aicave-worker-service
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

appName: aicave-worker-service
namespace: aicave-prod
replicaCount: 3

image:
  repository: docker.io/library/ai-cave-worker-service
  pullPolicy: Always
  tag: "1.0.2"

imagePullSecretName: huawei-swr-secret

service:
  type: ClusterIP
  port: 8976
  targetPort: 4000
  containerPort: 4000

ingress:
  enabled: true
  className: traefik
  # Traefik has no per-ingress body limit by default. Set a byte count to enforce one (nginx proxy-body-size equivalent).
  maxRequestBodyBytes: 1048576
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: www.aicave.ai
      paths:
        - path: /public/api/v1/worker
          pathType: Prefix
  tls:
    enabled: true
    secretName: aicave-console-tls

env:
  authMode: "report"
  keycloakAllowedClients: "ai-cave-prod"
  keycloakUrl: "https://id24.aicave.ai"
  keycloakRealm: "eportal"
  nodeOptions: "--max-old-space-size=384"
  nodeEnv: "Development"
  port: "4000"
  redisHost: "my-redis-master.aicave-prod.svc.cluster.local"
  redisPort: "6379"
  storagePath: "https://www.aicave.ai/public/api/v1/s3"
  tosBucket: "ai-cave"
  tosRegion: "ap-southeast-3"
  tosEndpoint: "tos-ap-southeast-3.bytepluses.com"
  # TOS เรียก upload callback ที่ <workerPublicUrl>/upload/callback (ingress rewrite → /api)
  workerPublicUrl: "https://sit.aicave.ai/public/api/v1/worker"
  # Ark เรียก <byteplusCallbackBaseUrl>/webhooks/byteplus/video/:taskId ที่ core (ingress rewrite → /api)
  # SIT รับ callback จากข้างนอกไม่ได้ → ว่าง = ไม่ส่ง callback_url (video จบด้วย poll-check)
  byteplusCallbackBaseUrl: ""

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL
#   secretEnv.TOS_ACCESS_KEY
#   secretEnv.TOS_SECRET_KEY

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nameOverride: ""
fullnameOverride: ""
