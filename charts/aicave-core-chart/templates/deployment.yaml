apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      containers:
      - name: {{ .Values.appName }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.containerPort }}
          protocol: TCP
        env:
        - name: NODE_ENV
          value: {{ .Values.env.nodeEnv | quote }}
        {{- if .Values.env.nodeOptions }}
        - name: NODE_OPTIONS
          value: {{ .Values.env.nodeOptions | quote }}
        {{- end }}
        # Keycloak token check — off | report | enforce (ดู docs/auth-rollout.md)
        - name: AUTH_MODE
          value: {{ .Values.env.authMode | default "off" | quote }}
        - name: KEYCLOAK_ALLOWED_CLIENTS
          value: {{ .Values.env.keycloakAllowedClients | default "" | quote }}
        - name: KEYCLOAK_URL
          value: {{ .Values.env.keycloakUrl | quote }}
        - name: KEYCLOAK_REALM
          value: {{ .Values.env.keycloakRealm | quote }}
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: INTERNAL_API_KEY
              # ยังไม่มีใน secret ก็ start ได้ — core ยอมเฉพาะตอนยังไม่ enforce
              optional: true
        - name: PORT
          value: {{ .Values.env.port | quote }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: DATABASE_URL
        - name: PATH_MOUNTDIR_UPLOAD
          value: {{ .Values.env.pathMountdirUpload | quote }}
        - name: STORAGE_PATH
          value: {{ .Values.env.storagePath | quote }}
        - name: BYTEPLUS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: BYTEPLUS_ACCESS_KEY
        - name: BYTEPLUS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: BYTEPLUS_SECRET_KEY
        - name: TOS_BUCKET
          value: {{ .Values.env.tosBucket | quote }}
        - name: TOS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: TOS_ACCESS_KEY
        - name: TOS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: TOS_SECRET_KEY
        - name: TOS_REGION
          value: {{ .Values.env.tosRegion | quote }}
        - name: TOS_ENDPOINT
          value: {{ .Values.env.tosEndpoint | quote }}
        - name: BYTEPLUS_CALLBACK_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: BYTEPLUS_CALLBACK_SECRET
              # ไม่มี key นี้ = ไม่ส่ง callback_url (ใช้ poll-check อย่างเดียว) ไม่ทำให้ pod start ไม่ขึ้น
              optional: true
        - name: REDIS_HOST
          value: {{ .Values.env.redisHost | quote }}
        - name: REDIS_PORT
          value: {{ .Values.env.redisPort | quote }}
        - name: EMAIL_API_URL
          value: {{ .Values.env.emailApiUrl | quote }}
        - name: RECEIVE_EMAIL
          value: {{ .Values.env.receiveEmail | quote }}
        - name: LLM_GATEWAY_URL
          value: {{ .Values.env.llmGatewayUrl | quote }}
        - name: LLM_PROJECT_ID
          value: {{ .Values.env.llmProjectId | quote }}
        - name: LLM_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: LLM_ADMIN_TOKEN
        # OpenTelemetry → Grafana Alloy — ไม่ตั้ง otel.endpoint = ไม่ส่ง telemetry (tracing.ts เป็น no-op)
        {{- if .Values.otel.endpoint }}
        - name: OTEL_SERVICE_NAME
          value: {{ .Values.otel.serviceName | default .Values.appName | quote }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.otel.endpoint | quote }}
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        # Tempo รับแค่ traces — เปิด "otlp" เมื่อ endpoint เป็น Alloy/collector ที่ส่งต่อ metrics ได้
        - name: OTEL_METRICS_EXPORTER
          value: {{ .Values.otel.metricsExporter | default "none" | quote }}
        - name: OTEL_LOGS_EXPORTER
          value: "none"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: {{ printf "deployment.environment=%s,service.namespace=aicave" .Values.otel.environment | quote }}
        - name: OTEL_TRACES_SAMPLER
          value: "parentbased_traceidratio"
        - name: OTEL_TRACES_SAMPLER_ARG
          value: {{ .Values.otel.samplerRatio | quote }}
        - name: OTEL_BSP_MAX_QUEUE_SIZE
          value: "1024"
        - name: OTEL_SDK_DISABLED
          value: {{ .Values.otel.disabled | default false | quote }}
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: OTEL_EXPORTER_OTLP_HEADERS
              # ต้องมีเฉพาะเมื่อ collector บังคับ auth
              optional: true
        {{- end }}
        resources:
          requests:
            memory: {{ .Values.resources.requests.memory | quote }}
            cpu: {{ .Values.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.resources.limits.memory | quote }}
            cpu: {{ .Values.resources.limits.cpu | quote }}
