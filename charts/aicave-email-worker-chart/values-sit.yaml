# SIT Environment Values
# Override specific values for SIT environment

namespace: aicave-sit
replicaCount: 1

image:
  tag: "1.0.1"

env:
  nodeOptions: "--max-old-space-size=192"
  nodeEnv: "Development"
  port: "5001"
  redisHost: "my-redis-master.redis.svc.cluster.local"
  redisPort: "6379"
  smtpHost: "smtp.office365.com"
  smtpPort: "587"
  smtpUser: "internalsupport@osd.co.th"
  smtpFrom: "internalsupport@osd.co.th"
  smtpService: "outlook"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.SMTP_PASSWORD

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "256Mi"
    cpu: "500m"
