# SIT Environment Values
# Override specific values for SIT environment

namespace: aicave-sit
replicaCount: 1

image:
  tag: "1.0.1"

ingress:
  hosts:
    - host: sit.aicave.ai
      paths:
        - path: /public/api/v1/worker(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls-sit
  websocketBackendService: aicave-core-service
  websocketBackendPort: 8971

env:
  authMode: "report"
  keycloakAllowedClients: "ai-cave-sit"
  keycloakUrl: "https://id24.aicave.ai"
  keycloakRealm: "eportal"
  nodeOptions: "--max-old-space-size=192"
  nodeEnv: "Development"
  port: "4000"
  redisHost: "my-redis-master.redis.svc.cluster.local"
  redisPort: "6379"
  storagePath: "https://sit.aicave.ai/public/api/v1/s3"
  tosBucket: "ai-cave-sit"
  tosRegion: "ap-southeast-3"
  tosEndpoint: "tos-ap-southeast-3.bytepluses.com"
  # TOS เรียก upload callback ที่ <workerPublicUrl>/upload/callback (ingress rewrite → /api)
  workerPublicUrl: "https://sit.aicave.ai/public/api/v1/worker"
  # Ark เรียก <byteplusCallbackBaseUrl>/webhooks/byteplus/video/:taskId ที่ core (ingress rewrite → /api)
  # SIT รับ callback จากข้างนอกไม่ได้ → ว่าง = ไม่ส่ง callback_url (video จบด้วย poll-check)
  byteplusCallbackBaseUrl: ""

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL
#   secretEnv.TOS_ACCESS_KEY
#   secretEnv.TOS_SECRET_KEY

otel:
  # OTLP HTTP endpoint (Tempo/Alloy) — ว่าง = ปิด telemetry
  endpoint: "http://tempo.tempo.svc.cluster.local:4318"
  serviceName: "aicave-worker"
  # Tempo ไม่รับ metrics — ใช้ "otlp" เมื่อมี Alloy/collector
  metricsExporter: "none"
  environment: "sit"
  samplerRatio: "1.0"
  disabled: false

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "256Mi"
    cpu: "500m"
