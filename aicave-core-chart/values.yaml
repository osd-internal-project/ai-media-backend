# Default values for aicave-core-service
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

appName: aicave-core-service
namespace: aicave-prod
replicaCount: 3

image:
  repository: docker.io/library/ai-core-be
  pullPolicy: IfNotPresent
  tag: "v1.0.25"

service:
  type: ClusterIP
  port: 8971
  targetPort: 4002
  containerPort: 8971

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "32k"
    nginx.ingress.kubernetes.io/large-client-header-buffers: "4 32k"
    nginx.ingress.kubernetes.io/rewrite-target: /api/$2
  hosts:
    - host: www.aicave.ai
      paths:
        - path: /public/api/v1/core(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls

env:
  nodeEnv: "Production"
  port: "4002"
  databaseUrl: "postgresql://ai_cave:osd@1234@10.134.2.3:5432/ai_cave?schema=public"
  pathMountdirUpload: "./uploads"
  storagePath: "https://www.aicave.ai/public/api/v1/s3"
  byteplusAccessKey: "AKAPYzE5OGNhNmRkZDVlNDllYzlhM2MwNTU3MTE0YWM4ZGM"
  byteplusSecretKey: "T1RnM09HSTJNVFEwWmpBek5EY3lNMkZqWmpabE5tWm1aR0ZrT0dabU9UVQ=="
  tosBucket: "ai-cave"
  tosAccessKey: "AKAPYjgyZmRiNzcwOGUzNGQzMWEzOTljMmJlMGMxZmIxN2M"
  tosSecretKey: "WW1aaU5URTVNV1ptWmpKak5HWTJNbUpoTTJJeU1HWmlaak0zTlRRMVpUVQ=="
  tosRegion: "ap-southeast-3"
  tosEndpoint: "tos-ap-southeast-3.bytepluses.com"
  redisHost: "my-redis-master"
  redisPort: "6379"

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

nameOverride: ""
fullnameOverride: ""
