# Production Environment Values
# Override specific values for PROD environment

namespace: aicave-prod
replicaCount: 3

image:
  tag: "1.0.0"

ingress:
  hosts:
    - host: www.aicave.ai
      paths:
        - path: /public/api/v1/report(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls

env:
  nodeEnv: "Production"
  port: "4001"
  pathMountdirUpload: "./uploads"
  pathDomain: "http://www.aicave.ai"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"
