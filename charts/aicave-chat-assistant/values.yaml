# Default values for aicave-chat-assistant
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

appName: aicave-chat-assistant
namespace: aicave-prod
replicaCount: 2

image:
  repository: docker.io/library/ai-chat-assistant-be
  pullPolicy: Always
  tag: "1.0.0"

imagePullSecretName: huawei-swr-secret

service:
  type: ClusterIP
  port: 8977
  targetPort: 4004
  containerPort: 4004

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "32k"
    nginx.ingress.kubernetes.io/large-client-header-buffers: "4 32k"
    # SSE / streaming support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/rewrite-target: /api/$2
  hosts:
    - host: www.aicave.ai
      paths:
        - path: /public/api/v1/chat-assistant(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls

env:
  nodeOptions: "--max-old-space-size=576"
  nodeEnv: "Production"
  port: "4004"
  # OpenAI / LLM
  # LLM gateway — the per-request credential is each organization's own
  # minted key, so there is no shared model API key here any more.
  llmGatewayUrl: "https://llmgateway.osd.co.th"
  llmProjectId: "team-mrcx7er7"
  llmChatTimeoutMs: "60000"
  corsAllowedOrigins: "https://www.aicave.ai"
  memoryMaxMessages: "20"
  memoryMaxTokenBudget: "8000"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL
#   secretEnv.LLM_ADMIN_TOKEN

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "768Mi"
    cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nameOverride: ""
fullnameOverride: ""
