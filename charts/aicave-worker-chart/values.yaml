# Default values for aicave-worker-service
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

appName: aicave-worker-service
namespace: aicave-prod
replicaCount: 3

image:
  repository: docker.io/library/ai-cave-worker-service
  pullPolicy: Always
  tag: "1.0.2"

imagePullSecretName: huawei-swr-secret

service:
  type: ClusterIP
  port: 8976
  targetPort: 4000
  containerPort: 4000

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # ไฟล์ upload ตรงเข้า TOS แล้ว worker รับแค่ JSON/FormData เล็ก ๆ
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "32k"
    nginx.ingress.kubernetes.io/large-client-header-buffers: "4 32k"
    nginx.ingress.kubernetes.io/rewrite-target: /api/$2
  hosts:
    - host: www.aicave.ai
      paths:
        - path: /public/api/v1/worker(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: aicave-console-tls

env:
  nodeOptions: "--max-old-space-size=384"
  nodeEnv: "Development"
  port: "4000"
  redisHost: "my-redis-master.aicave-prod.svc.cluster.local"
  redisPort: "6379"
  storagePath: "https://www.aicave.ai/public/api/v1/s3"
  tosBucket: "ai-cave"
  tosRegion: "ap-southeast-3"
  tosEndpoint: "tos-ap-southeast-3.bytepluses.com"
  # TOS เรียก upload callback ที่ <workerPublicUrl>/upload/callback (ingress rewrite → /api)
  workerPublicUrl: "https://sit.aicave.ai/public/api/v1/worker"
  # Ark เรียก <byteplusCallbackBaseUrl>/webhooks/byteplus/video/:taskId ที่ core (ingress rewrite → /api)
  # SIT รับ callback จากข้างนอกไม่ได้ → ว่าง = ไม่ส่ง callback_url (video จบด้วย poll-check)
  byteplusCallbackBaseUrl: ""

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL
#   secretEnv.TOS_ACCESS_KEY
#   secretEnv.TOS_SECRET_KEY

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nameOverride: ""
fullnameOverride: ""
