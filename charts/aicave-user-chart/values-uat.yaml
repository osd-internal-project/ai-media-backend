# UAT Environment Values
# Override specific values for UAT environment

namespace: aicave
replicaCount: 1

image:
  tag: "1.0.4"

ingress:
  hosts:
    - host: aicave-uat.osd.co.th
      paths:
        - path: /public/api/v1/user
          pathType: Prefix
  tls:
    enabled: true
    secretName: aicave-tls

env:
  authMode: "report"
  keycloakAllowedClients: "ai-cave-prod"
  nodeOptions: "--max-old-space-size=288"
  nodeEnv: "staging"
  port: "4000"
  nodeTlsRejectUnauthorized: "0"
  pathMountdirUpload: "./uploads"
  pathDomain: "http://aicave-uat.osd.co.th"
  emailApiUrl: "http://aicave-email-api-service.aicave.svc.cluster.local:8974"
  coreApiUrl: "http://aicave-core-service.aicave.svc.cluster.local:8971/api"
  frontendUrl: "https://aicave-uat.osd.co.th"
  keycloakUrl: "https://auth-events-uat.osd.co.th"
  keycloakRealm: "eportal"
  keycloakClientId: "ai-cave-prod"
  keycloakRedirectUri: "https://aicave-uat.osd.co.th/callback"
  keycloakIdpMicrosoftAlias: "microsoft"
  llmGatewayUrl: "https://llmgateway.osd.co.th"
  llmProjectId: "team-mrcx7er7"
  omiseApiUrl: "https://api.omise.co"
  omiseApiVersion: "2019-05-29"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.DATABASE_URL
#   secretEnv.KEYCLOAK_CLIENT_SECRET
#   secretEnv.OMISE_SECRET_KEY

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "384Mi"
    cpu: "750m"

# Resolve the UAT Keycloak host through the in-cluster Traefik (ClusterIP) so pods do
# not depend on public DNS / WAF for this name.
hostAliases:
  - ip: "100.96.0.228"
    hostnames:
      - "auth-events-uat.osd.co.th"
