# Default values for aicave-email-api-service
# This is a YAML-formatted file.
# Internal service only - no ingress.
# Accessed via: aicave-email-api-service.<namespace>.svc.cluster.local:8974

appName: aicave-email-api-service
namespace: aicave-prod
replicaCount: 3

image:
  repository: docker.io/library/ai-cave-email-api
  pullPolicy: IfNotPresent
  tag: "v1.0.1"

service:
  type: ClusterIP
  port: 8974
  targetPort: 5000
  containerPort: 8974

env:
  nodeEnv: "Production"
  port: "5000"
  redisHost: "my-redis-master"
  redisPort: "6379"

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nameOverride: ""
fullnameOverride: ""
